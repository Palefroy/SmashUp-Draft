# Fabrication automatique de l'APK Android (application locale, sans navigateur) avec Capacitor.
# Se lance : - tout seul à chaque push qui modifie le site (HTML, CSS, JS, data, images, icônes, dossier apk/)
#            - à la demande : onglet Actions > "Build APK" > bouton "Run workflow"
# Résultat : l'APK est publié dans l'onglet Releases du dépôt (release "apk-latest", fichier SmashUp-Draft.apk).
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "manifest.json"
      - "data/**"
      - "img/**"
      - "icons/**"
      - "apk/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copier les fichiers du site dans build/www
        run: |
          mkdir -p build/www
          cp index.html style.css script.js manifest.json build/www/
          cp -r data img icons build/www/

      # Les images sont allégées UNIQUEMENT dans build/www (copie temporaire du build).
      # Les fichiers du dépôt, et donc le site GitHub Pages, restent en pleine qualité.
      # Les noms et extensions ne changent pas : aucun lien à modifier dans le code.
      # Réglages : la taille max (ex. 1080x1080) et la qualité (-quality 65, de 1 à 100) ; le signe > ne réduit que les images plus grandes.
      - name: Compresser les images pour l'APK
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          echo "Avant : $(du -sh build/www/img | cut -f1)"
          # Illustrations des factions
          find build/www/img -path "*/img/illus/*" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
            -exec mogrify -auto-orient -strip -resize "1080x1080>" -quality 65 {} +
          # Montages des 3 cartes (images très larges : limite plus haute pour rester lisibles)
          find build/www/img -path "*/img/cards/*" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
            -exec mogrify -auto-orient -strip -resize "1600x1600>" -quality 70 {} +
          # Icônes des factions (petites)
          find build/www/img -path "*/img/ico/*" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
            -exec mogrify -strip -resize "512x512>" -quality 75 {} +
          echo "Après : $(du -sh build/www/img | cut -f1)"

      - name: Préparer le projet Capacitor
        run: |
          cp apk/capacitor.config.json build/
          cp -r apk/assets build/assets
          cd build
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7 @capacitor/assets
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Réglages WebView (texte à 100 %, zoom bloqué)
        working-directory: build/android
        run: |
          F=app/src/main/java/com/palefroy/smashupdraft/MainActivity.java
          test -d "$(dirname "$F")"
          cat > "$F" <<'EOF'
          package com.palefroy.smashupdraft;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  reglagesWebView();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  reglagesWebView();
              }

              // Texte non agrandi par la taille de police du système, zoom (pincer / double appui) désactivé.
              private void reglagesWebView() {
                  if (this.bridge == null || this.bridge.getWebView() == null) return;
                  WebSettings s = this.bridge.getWebView().getSettings();
                  s.setTextZoom(100);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
              }
          }
          EOF

      - name: Numéro de version (augmente à chaque build)
        working-directory: build/android
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle

      - name: Clé de signature fixe (permet les mises à jour par-dessus)
        run: |
          mkdir -p ~/.android
          cp apk/debug.keystore ~/.android/debug.keystore

      - name: Compiler l'APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp build/android/app/build/outputs/apk/debug/app-debug.apk SmashUp-Draft.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK Android (dernière version)
          body: "Dernière version de l'application Android. Télécharge SmashUp-Draft.apk ci-dessous. Construit automatiquement (build n°${{ github.run_number }})."
          files: SmashUp-Draft.apk
          make_latest: true
