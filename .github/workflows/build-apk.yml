# Fabrication automatique de l'APK Android (application locale, sans navigateur) avec Capacitor.
# Se lance : - tout seul à chaque push qui modifie le site (HTML, CSS, JS, data, images, icônes, dossier apk/)
#            - à la demande : onglet Actions > "Build APK" > bouton "Run workflow"
# Résultat : l'APK est publié dans l'onglet Releases du dépôt (release "apk-latest", fichier SmashUp-Draft.apk).
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "maj.js"
      - "apk-maj.js"
      - "sw.js"
      - "manifest.json"
      - "data/**"
      - "img/**"
      - "icons/**"
      - "apk/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copier les fichiers du site dans build/www
        run: |
          mkdir -p build/www
          cp index.html style.css script.js maj.js apk-maj.js sw.js manifest.json build/www/
          cp -r data img icons build/www/

      # Liste du contenu embarqué (chemin + clé de la source) : l'appli s'en sert pour ne télécharger que ce qui a changé.
      - name: Inventaire du contenu embarqué
        run: node apk/contenu.mjs apk build/www/contenu-apk.json "$(git log -1 --format=%ct)" "$(sha256sum apk/compresser-images.sh | cut -d' ' -f1)" "${{ github.run_number }}"

      # Les images sont allégées UNIQUEMENT dans build/www (copie temporaire du build) ; le dépôt et le site GitHub Pages restent en pleine qualité.
      # Réglages (taille max, qualité) : apk/compresser-images.sh, partagé avec publish-content.yml pour que le contenu téléchargé = celui de l'APK.
      - name: Compresser les images pour l'APK
        run: bash apk/compresser-images.sh build/www

      - name: Préparer le projet Capacitor
        run: |
          cp apk/capacitor.config.json build/
          cp -r apk/assets build/assets
          cd build
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7 @capacitor/assets
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Réglages WebView (texte à 100 %, zoom bloqué)
        working-directory: build/android
        run: |
          F=app/src/main/java/com/palefroy/smashupdraft/MainActivity.java
          test -d "$(dirname "$F")"
          cat > "$F" <<'EOF'
          package com.palefroy.smashupdraft;

          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.ServiceWorkerClient;
          import android.webkit.ServiceWorkerController;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  reglagesWebView();
                  reglagesServiceWorker();
              }

              // Sans ceci, le service worker (mise à jour du contenu) ne peut pas charger sw.js : on le branche sur le serveur local de Capacitor.
              private void reglagesServiceWorker() {
                  if (Build.VERSION.SDK_INT < 24 || this.bridge == null) return;
                  ServiceWorkerController.getInstance().setServiceWorkerClient(new ServiceWorkerClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebResourceRequest request) {
                          return MainActivity.this.getBridge().getLocalServer().shouldInterceptRequest(request);
                      }
                  });
              }

              @Override
              public void onStart() {
                  super.onStart();
                  reglagesWebView();
              }

              // Texte non agrandi par la taille de police du système, zoom (pincer / double appui) désactivé.
              private void reglagesWebView() {
                  if (this.bridge == null || this.bridge.getWebView() == null) return;
                  WebSettings s = this.bridge.getWebView().getSettings();
                  s.setTextZoom(100);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
              }
          }
          EOF

      - name: Ajouter le plugin ApkInstaller (mise à jour de l'APK dans l'appli)
        run: python3 apk/ajouter-plugin-android.py build/android

      - name: Numéro de version (augmente à chaque build)
        working-directory: build/android
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle

      - name: Clé de signature fixe (permet les mises à jour par-dessus)
        run: |
          mkdir -p ~/.android
          cp apk/debug.keystore ~/.android/debug.keystore

      - name: Compiler l'APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp build/android/app/build/outputs/apk/debug/app-debug.apk SmashUp-Draft.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK Android (dernière version)
          body: "Dernière version de l'application Android. Télécharge SmashUp-Draft.apk ci-dessous. Construit automatiquement (build n°${{ github.run_number }})."
          files: SmashUp-Draft.apk
          make_latest: true

      - name: Générer apk.json
        run: node apk/apk-json.mjs SmashUp-Draft.apk apk.json --build "${{ github.run_number }}" --version "$(git log -1 --format=%ct)" --notes-fr "Nouvelle version de l'appli (interface et nouveautés)." --notes-en "New app version (interface and new features)."

      # Branche séparée « apk-info » (et non « content », recréée à zéro par publish-content.yml). Poussée APRÈS la release : l'asset est déjà en ligne.
      - name: Publier apk.json sur la branche apk-info
        run: |
          mkdir apk-out
          cp apk.json apk-out/
          cd apk-out
          git init -q -b apk-info
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "apk.json (build n°${{ github.run_number }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-info
